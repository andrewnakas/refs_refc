<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRFS Composite Reflectivity (REFC) - Live Radar Forecast</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 80px;
            width: 100%;
        }

        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            min-width: 250px;
            backdrop-filter: blur(10px);
        }

        .info-panel h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        .info-panel p {
            font-size: 13px;
            margin: 5px 0;
            color: #e0e0e0;
        }

        .info-panel .label {
            color: #9e9e9e;
            font-size: 11px;
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .timeline {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        #timeline-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #424242;
            outline: none;
            -webkit-appearance: none;
        }

        #timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4fc3f7;
            cursor: pointer;
        }

        #timeline-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4fc3f7;
            cursor: pointer;
            border: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #424242;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #616161;
        }

        button.active {
            background: #4fc3f7;
        }

        #forecast-time {
            font-size: 14px;
            font-weight: bold;
            min-width: 120px;
            color: #4fc3f7;
        }

        .legend {
            position: absolute;
            bottom: 90px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .legend h3 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #9e9e9e;
        }

        .legend-scale {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .legend-color {
            width: 30px;
            height: 15px;
            border: 1px solid #555;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #4fc3f7;
            z-index: 2000;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(211, 47, 47, 0.9);
            padding: 20px;
            border-radius: 8px;
            z-index: 2000;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading RRFS REFC data...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="map"></div>

    <div class="info-panel">
        <h2>RRFS Composite Reflectivity</h2>
        <p class="label">CYCLE</p>
        <p id="cycle-info">Loading...</p>
        <p class="label">VALID TIME</p>
        <p id="valid-time">--</p>
        <p class="label">DATA RANGE</p>
        <p id="data-range">--</p>
    </div>

    <div class="legend">
        <h3>REFLECTIVITY (dBZ)</h3>
        <div class="legend-scale">
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(150,150,150);"></div>
                <span>70+</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(248,0,253);"></div>
                <span>45-70</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(212,0,0);"></div>
                <span>30-45</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(253,139,0);"></div>
                <span>20-30</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(253,248,2);"></div>
                <span>15-20</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(2,253,2);"></div>
                <span>5-15</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: rgb(1,159,244);"></div>
                <span>0-5</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="timeline">
            <span id="forecast-time">F000 (+0h)</span>
            <input type="range" id="timeline-slider" min="0" max="0" value="0" step="1">
        </div>
        <div class="button-group">
            <button id="play-pause">▶ Play</button>
            <button id="prev-frame">◀ Prev</button>
            <button id="next-frame">Next ▶</button>
            <span style="color: #9e9e9e; font-size: 12px; margin-left: auto;" id="update-info"></span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Configuration
        // RRFS_NA_3km grid center is at 55.0°N, -112.5°W
        const DEFAULT_CENTER = [45.0, -100.0]; // Center on North America (RRFS_NA domain)
        const DEFAULT_ZOOM = 3;
        let map, imageOverlay;
        let forecastData = null;
        let currentFrame = 0;
        let isPlaying = false;
        let animationInterval = null;

        // Initialize map
        function initMap() {
            map = L.map('map', {
                center: DEFAULT_CENTER,
                zoom: DEFAULT_ZOOM,
                zoomControl: true
            });

            // Add base layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);
        }

        // Load forecast data
        async function loadForecastData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                if (!data.forecasts || data.forecasts.length === 0) {
                    throw new Error('No forecast data available');
                }

                return data;
            } catch (error) {
                console.error('Error loading forecast data:', error);
                throw error;
            }
        }

        // Update map with forecast frame
        function updateFrame(frameIndex) {
            if (!forecastData || !forecastData.forecasts[frameIndex]) {
                return;
            }

            currentFrame = frameIndex;
            const forecast = forecastData.forecasts[frameIndex];

            // Remove existing overlay
            if (imageOverlay) {
                map.removeLayer(imageOverlay);
            }

            // Get bounds (using default North America bounds if not available)
            const bounds = forecastData.bounds || {};
            const latMin = bounds.lat_min || 20.0;
            const latMax = bounds.lat_max || 55.0;
            const lonMin = bounds.lon_min || -130.0;
            const lonMax = bounds.lon_max || -60.0;

            // Add new overlay
            imageOverlay = L.imageOverlay(
                forecast.tile,
                [[latMin, lonMin], [latMax, lonMax]],
                {
                    opacity: 0.7,
                    interactive: false
                }
            ).addTo(map);

            // Update UI
            document.getElementById('timeline-slider').value = frameIndex;
            document.getElementById('forecast-time').textContent =
                `F${String(forecast.forecast_hour).padStart(3, '0')} (+${forecast.forecast_hour}h)`;

            // Update valid time
            if (forecastData.source && forecastData.source.cycle_date && forecastData.source.cycle_hour) {
                const cycleDate = forecastData.source.cycle_date;
                const cycleHour = forecastData.source.cycle_hour;
                const validDate = new Date(
                    cycleDate.substring(0, 4),
                    parseInt(cycleDate.substring(4, 6)) - 1,
                    cycleDate.substring(6, 8),
                    parseInt(cycleHour) + forecast.forecast_hour,
                    0
                );
                document.getElementById('valid-time').textContent =
                    validDate.toUTCString().replace('GMT', 'UTC');
            }

            // Update data range
            if (forecast.stats) {
                document.getElementById('data-range').textContent =
                    `${forecast.stats.min.toFixed(1)} to ${forecast.stats.max.toFixed(1)} dBZ`;
            }
        }

        // Animation controls
        function togglePlayPause() {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        function startAnimation() {
            isPlaying = true;
            document.getElementById('play-pause').textContent = '⏸ Pause';
            document.getElementById('play-pause').classList.add('active');

            animationInterval = setInterval(() => {
                currentFrame = (currentFrame + 1) % forecastData.forecasts.length;
                updateFrame(currentFrame);
            }, 500); // 500ms per frame
        }

        function stopAnimation() {
            isPlaying = false;
            document.getElementById('play-pause').textContent = '▶ Play';
            document.getElementById('play-pause').classList.remove('active');

            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }

        function nextFrame() {
            stopAnimation();
            currentFrame = (currentFrame + 1) % forecastData.forecasts.length;
            updateFrame(currentFrame);
        }

        function prevFrame() {
            stopAnimation();
            currentFrame = (currentFrame - 1 + forecastData.forecasts.length) % forecastData.forecasts.length;
            updateFrame(currentFrame);
        }

        // Initialize application
        async function init() {
            try {
                document.getElementById('loading').style.display = 'block';

                // Initialize map
                initMap();

                // Load data
                forecastData = await loadForecastData();

                // Update cycle info
                if (forecastData.source) {
                    const cycleDate = forecastData.source.cycle_date;
                    const cycleHour = forecastData.source.cycle_hour;
                    document.getElementById('cycle-info').textContent =
                        `${cycleDate.substring(0, 4)}-${cycleDate.substring(4, 6)}-${cycleDate.substring(6, 8)} ${cycleHour}:00 UTC`;
                }

                // Update info
                if (forecastData.generated) {
                    const genDate = new Date(forecastData.generated);
                    document.getElementById('update-info').textContent =
                        `Updated: ${genDate.toUTCString().replace('GMT', 'UTC')}`;
                }

                // Setup timeline
                const slider = document.getElementById('timeline-slider');
                slider.max = forecastData.forecasts.length - 1;
                slider.addEventListener('input', (e) => {
                    stopAnimation();
                    updateFrame(parseInt(e.target.value));
                });

                // Setup controls
                document.getElementById('play-pause').addEventListener('click', togglePlayPause);
                document.getElementById('next-frame').addEventListener('click', nextFrame);
                document.getElementById('prev-frame').addEventListener('click', prevFrame);

                // Show first frame
                updateFrame(0);

                // Hide loading
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = `Error loading data: ${error.message}`;
                errorDiv.style.display = 'block';
            }
        }

        // Start when page loads
        window.addEventListener('load', init);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopAnimation();
        });
    </script>
</body>
</html>
