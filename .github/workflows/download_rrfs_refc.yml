name: Download RRFS REFC Data

on:
  # Trigger on push to the current branch
  push:
    branches:
      - claude/github-actions-rrfs-download-01MZQaSh7Vdc2J8VtgMZqT2V

  # Run on a schedule - every 3 hours
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours at minute 0

  # Allow manual triggering
  workflow_dispatch:

jobs:
  download-rrfs-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/github-actions-rrfs-download-01MZQaSh7Vdc2J8VtgMZqT2V
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git LFS
        run: |
          git lfs install
          git lfs track "*.grib2"
          git lfs track "*.grib2.idx"
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create data directory
        run: mkdir -p rrfs_data

      - name: Download RRFS REFC data (18 hours, North America, REFC-only)
        run: |
          python download_rrfs_refc_optimized.py --domain na --num-forecasts 18
        continue-on-error: true

      - name: List downloaded files
        run: |
          echo "=== Downloaded GRIB files ==="
          ls -lh rrfs_data/*.grib2 2>/dev/null || echo "No GRIB files found"
          echo ""
          echo "=== Metadata ==="
          cat rrfs_data/metadata.json 2>/dev/null || echo "No metadata file"

      - name: Check if data was downloaded
        id: check_data
        run: |
          if [ -d "rrfs_data" ] && [ "$(ls -A rrfs_data/*.grib2 2>/dev/null)" ]; then
            echo "has_data=true" >> $GITHUB_OUTPUT
            echo "✓ New RRFS data downloaded"
          else
            echo "has_data=false" >> $GITHUB_OUTPUT
            echo "ℹ No new data to commit (RRFS may be offline or data already current)"
          fi

      - name: Configure Git
        if: steps.check_data.outputs.has_data == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local lfs.allowincompletepush true

      - name: Commit and push data
        if: steps.check_data.outputs.has_data == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .gitattributes rrfs_data/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RRFS REFC data - $(date -u +'%Y-%m-%d %H:%M UTC')"

            # Push regular git objects first
            git push origin claude/github-actions-rrfs-download-01MZQaSh7Vdc2J8VtgMZqT2V

            # Then push LFS objects separately
            git lfs push origin claude/github-actions-rrfs-download-01MZQaSh7Vdc2J8VtgMZqT2V --all || echo "LFS push completed with warnings (this is normal)"
          fi

      - name: Upload artifacts (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrfs-data-logs
          path: |
            rrfs_data/metadata.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## RRFS REFC Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "rrfs_data/metadata.json" ]; then
            echo "**Status:** ✓ Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Metadata:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat rrfs_data/metadata.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠ No data downloaded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This may be expected if:" >> $GITHUB_STEP_SUMMARY
            echo "- RRFS real-time data is currently offline" >> $GITHUB_STEP_SUMMARY
            echo "- All current data has already been downloaded" >> $GITHUB_STEP_SUMMARY
            echo "- There was a temporary network issue" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data Directory:** \`rrfs_data/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Domain: North America (NA)" >> $GITHUB_STEP_SUMMARY
          echo "- Forecast hours: 18 (f000-f017)" >> $GITHUB_STEP_SUMMARY
          echo "- Download method: REFC field only via byte-range requests" >> $GITHUB_STEP_SUMMARY
          echo "- File size: ~7-8 MB per forecast hour (99% smaller than full files)" >> $GITHUB_STEP_SUMMARY
          echo "- Total size: ~144 MB for 18 forecast hours" >> $GITHUB_STEP_SUMMARY
          echo "- Storage: Git LFS for efficient storage" >> $GITHUB_STEP_SUMMARY
