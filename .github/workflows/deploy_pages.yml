name: Build and Deploy RRFS REFC Visualization to GitHub Pages (LEGACY - for testing only)

on:
  # DISABLED - use download_and_visualize.yml instead
  # This workflow is kept for manual testing only

  # Allow manual triggering only
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Use built-in LFS support
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify LFS files downloaded
        run: |
          echo "Verifying Git LFS files were downloaded:"
          ls -lh rrfs_data/*.grib2 2>/dev/null | head -5 || echo "No GRIB files found"
          echo ""
          echo "Checking file sizes:"
          for f in rrfs_data/*.grib2; do
            if [ -f "$f" ]; then
              size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null)
              if [ "$size" -lt 1024 ]; then
                echo "WARNING: $f is only $size bytes (likely LFS pointer!)"
              else
                echo "OK: $f is $(($size / 1024 / 1024)) MB"
              fi
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow xarray eccodes cfgrib requests matplotlib cartopy

      - name: Make processing scripts executable
        run: |
          chmod +x process_grib_for_web.py
          chmod +x create_static_map.py

      - name: Create static maps with Cartopy (proper projection)
        run: |
          echo "Generating static maps with correct rotated pole projection..."
          python create_static_map.py

      - name: Process GRIB files for Leaflet tiles (fallback)
        run: |
          echo "Generating Leaflet tiles (legacy approach)..."
          python process_grib_for_web.py || echo "Tile processing completed with warnings"

      - name: List generated files
        run: |
          echo "=== Generated files in docs/ ==="
          ls -lh docs/
          echo ""
          echo "=== Static Maps (Cartopy) ==="
          ls -lh docs/maps/ 2>/dev/null || echo "No maps directory"
          echo ""
          echo "=== Tiles (Leaflet fallback) ==="
          ls -lh docs/tiles/ 2>/dev/null || echo "No tiles directory"
          echo ""
          echo "=== Metadata files ==="
          cat docs/maps_data.json 2>/dev/null || echo "No maps_data.json"
          echo ""
          cat docs/data.json 2>/dev/null || echo "No data.json"

      - name: Create .nojekyll file
        run: touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
