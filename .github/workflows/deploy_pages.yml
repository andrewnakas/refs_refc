name: Build and Deploy RRFS REFC Visualization to GitHub Pages

on:
  # Trigger when data is pushed to the branch
  push:
    branches:
      - claude/rrfs-refc-leaflet-map-01NpPdbxBGK6XNJjoBNqseKd
    paths:
      - 'rrfs_data/**'
      - 'process_grib_for_web.py'
      - 'docs/index.html'
      - '.github/workflows/deploy_pages.yml'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout LFS files
        run: |
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow xarray eccodes cfgrib requests

      - name: Make processing script executable
        run: chmod +x process_grib_for_web.py

      - name: Process GRIB files for web
        run: |
          python process_grib_for_web.py || echo "Processing completed with warnings"

      - name: List generated files
        run: |
          echo "=== Generated files in docs/ ==="
          ls -lh docs/
          echo ""
          echo "=== Tiles ==="
          ls -lh docs/tiles/ 2>/dev/null || echo "No tiles directory"
          echo ""
          echo "=== Data metadata ==="
          cat docs/data.json 2>/dev/null || echo "No data.json"

      - name: Create .nojekyll file
        run: touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
