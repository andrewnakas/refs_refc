name: Download and Visualize RRFS REFC Data

on:
  # Run on a schedule - every hour
  schedule:
    - cron: '15 * * * *'  # Every hour at 15 minutes past

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-rrfs"
  cancel-in-progress: false

jobs:
  download-and-visualize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow xarray eccodes cfgrib requests matplotlib cartopy

      - name: Download RRFS REFC data
        run: |
          mkdir -p rrfs_data
          python download_rrfs_refc_optimized.py --domain na --forecast-hours 0
        continue-on-error: true

      - name: List downloaded files
        run: |
          echo "=== Downloaded GRIB files ==="
          ls -lh rrfs_data/*.grib2 2>/dev/null || echo "No GRIB files found"
          echo ""
          echo "Checking file sizes:"
          for f in rrfs_data/*.grib2; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || echo "0")
              echo "  $f: $(($size / 1024 / 1024)) MB"
            fi
          done

      - name: Generate static maps with Cartopy
        run: |
          echo "Generating static maps with correct rotated pole projection..."
          python create_static_map.py

      - name: Generate perfect Leaflet image (exact bounds)
        run: |
          echo "Generating pixel-perfect Leaflet image with EXACT GRIB bounds..."
          python create_perfect_leaflet_tile.py

      - name: Generate Leaflet tiles (fallback)
        run: |
          echo "Generating Leaflet tiles (legacy approach)..."
          python process_grib_for_web.py || echo "Tile processing completed with warnings"

      - name: List generated visualizations
        run: |
          echo "=== Generated files in docs/ ==="
          ls -lh docs/
          echo ""
          echo "=== Static Maps (Cartopy) ==="
          ls -lh docs/maps/ 2>/dev/null || echo "No maps directory"
          echo ""
          echo "=== Tiles (Leaflet fallback) ==="
          ls -lh docs/tiles/ 2>/dev/null || echo "No tiles directory"

      - name: Create .nojekyll file
        run: touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: download-and-visualize
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output deployment URL
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
